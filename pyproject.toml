[project]
name = "mcp-imagetools"
version = "0.1.0"
description = "MCP server for image processing tools (chromakey, resize, compress, convert)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "tsilva" }]
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "Pillow>=12.3,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.15,<0.16",
]

[project.scripts]
mcp-imagetools = "mcp_imagetools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_imagetools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
  "click>=8.3.3",
  "cryptography>=50",
  "idna>=3.15",
  "pydantic-settings>=2.14.2",
  "pygments>=2.20",
  "pyjwt>=2.13",
  "python-multipart>=0.0.31",
  "starlette>=1.3.1",
]
